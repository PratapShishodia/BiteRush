[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /backend/*/logs/*.log
    Tag               biterush.*
    Parser            json
    Read_from_Head    true

[OUTPUT]
    Name                opensearch
    Match               biterush.*
    Host                opensearch
    Port                9200
    Index               biterush-logs
    Suppress_Type_Name  On
    Logstash_Format     Off
    Trace_Error         On
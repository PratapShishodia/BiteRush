spring:
  application:
    name: eureka-server
server:
  port: ${APPLICATION_PORT}

logging:
  structured:
    format:
      console: logstash
      file: logstash
    json:
      rename:
        "@timestamp": timestamp
        logger_name: logger
      exclude: "@version,thread_name,level_value"
      add:
        service: ${spring.application.name}
  level:
    root: INFO
    com:
      ps:
        backend: DEBUG
  file:
    name: ../../logs/${spring.application.name}.log

eureka:
  instance:
    hostname: localhost
  client:
    fetch-registry: false
    register-with-eureka: false
    serviceUrls:
      default-zone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

info:
  app:
    name: Discovery Server
    description: Eureka Discovery Server
    version: 1.0.0
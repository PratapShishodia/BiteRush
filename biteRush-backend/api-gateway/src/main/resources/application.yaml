server:
  port: ${APPLICATION_PORT}

spring:
  application:
    name: api-gateway

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  endpoint:
    gateway:
      access: unrestricted

  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: ${JWT_SECRET}
server:
  port: ${APPLICATION_PORT}

spring:
  application:
    name: api-gateway

logging:
  structured:
    format:
      console: logstash
      file: logstash
    json:
      rename:
        "@timestamp": timestamp
        logger_name: logger
      exclude: "@version,thread_name,level_value"
      add:
        service: ${spring.application.name}
  level:
    root: INFO
    com:
      ps:
        backend: DEBUG
  file:
    name: ../../logs/${spring.application.name}.log

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

management:
  endpoint:
    gateway:
      access: unrestricted

  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: ${JWT_SECRET}